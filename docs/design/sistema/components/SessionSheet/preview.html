<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,sans-serif;display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.t{padding:28px;background:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px;color:var(--ink);display:flex;flex-direction:column;gap:18px;align-items:flex-start}

.lbl{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.card{background:var(--card);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 7px);backdrop-filter:blur(6px);border:1px solid var(--line-soft);border-radius:14px 12px 16px 12px/12px 16px 12px 14px;padding:16px}
.disp{font-family:'Architects Daughter',cursive}.mono{font-family:'JetBrains Mono',monospace}
.btn{font:600 13px Inter;padding:8px 14px;border-radius:10px;cursor:pointer}
.p{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}.s{background:transparent;color:var(--ink);border:1px solid var(--line-soft)}.g{background:none;border:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.todo{border:2px solid var(--status-todo)}.run{border:2px solid var(--status-run);background:radial-gradient(var(--status-run) 3px,transparent 3.5px)}
.wait{background:var(--status-wait);box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--status-wait)}.done{background:var(--status-done)}.block{background:var(--status-block)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head><body><div class="t esc"><span class="lbl">escuro</span><div style="width:100%;background:var(--card-solid);border:1px solid var(--line-soft);border-bottom:none;border-radius:22px 22px 0 0;padding:14px 28px 24px;display:grid;grid-template-columns:1fr 120px;gap:20px"><div><div style="width:40px;height:4px;border-radius:2px;background:var(--line-soft);margin:0 auto 14px"></div><div class="mono" style="font-size:11px;color:var(--muted)">TASK-101 · etapa 3 de 7</div><div class="disp" style="font-size:36px;margin:4px 0 10px">SPEC</div><div style="font-size:14px;line-height:1.6;color:var(--muted)">O agente leu o Research e escreveu dois requisitos.</div><div class="row" style="margin-top:12px"><button class="btn p">Aprovar SPEC</button><button class="btn s">Refazer daqui</button></div></div><div style="font-size:12px;line-height:2;color:var(--muted);border-left:1px solid var(--line-soft);padding-left:12px"><div style="color:var(--ink);font-weight:600">Resumo</div><div>Pergunta</div><div>Terminal</div><div>Arquivos</div><div>Histórico</div></div></div></div><div class="t cla"><span class="lbl">claro</span><div style="width:100%;background:var(--card-solid);border:1px solid var(--line-soft);border-bottom:none;border-radius:22px 22px 0 0;padding:14px 28px 24px;display:grid;grid-template-columns:1fr 120px;gap:20px"><div><div style="width:40px;height:4px;border-radius:2px;background:var(--line-soft);margin:0 auto 14px"></div><div class="mono" style="font-size:11px;color:var(--muted)">TASK-101 · etapa 3 de 7</div><div class="disp" style="font-size:36px;margin:4px 0 10px">SPEC</div><div style="font-size:14px;line-height:1.6;color:var(--muted)">O agente leu o Research e escreveu dois requisitos.</div><div class="row" style="margin-top:12px"><button class="btn p">Aprovar SPEC</button><button class="btn s">Refazer daqui</button></div></div><div style="font-size:12px;line-height:2;color:var(--muted);border-left:1px solid var(--line-soft);padding-left:12px"><div style="color:var(--ink);font-weight:600">Resumo</div><div>Pergunta</div><div>Terminal</div><div>Arquivos</div><div>Histórico</div></div></div></div></body></html>
