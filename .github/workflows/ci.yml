name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatação
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Análise estática
        run: go vet ./...
      - name: Testes
        run: go test ./...

  documentacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Referências da documentação
        run: node site/scripts/conferir-referencias.mjs
